[package]
name = "stremio-linux-shell"
version = "1.1.2"
description = "Freedom to Stream"
authors = ["Stremio"]
homepage = "https://stremio.com"
repository = "https://github.com/Stremio/stremio-linux-shell"
license = "GPL-3.0-only"
edition = "2024"

[features]
default = ["ubuntu-resolute"]
offline-build = []
# GTK4/libadwaita/WebKitGTK API-version feature sets, one per natively
# supported Ubuntu release for the `.deb` build. Pick the set matching the
# target's shipped runtime libraries with `--no-default-features --features
# <set>`, e.g. for packaging on noble:
#   cargo build --no-default-features --features ubuntu-noble
# The versions below match what each release ships (checked against
# `apt-cache policy libgtk-4-1 libadwaita-1-0 libwebkitgtk-6.0-4`):
#   noble (24.04 LTS): GTK 4.14.5, libadwaita 1.5.0, WebKitGTK 2.52.3
#   resolute (devel):  GTK 4.22.4, libadwaita 1.9.0, WebKitGTK 2.52.3
# jammy (22.04 LTS) is NOT included here: it only ships GTK 4.6.9, but the
# `webkit6` crate's generated bindings require GTK4 features >= v4_10
# unconditionally (`gtk::Accessible` is referenced without a lower-version
# cfg guard), so this crate cannot be built against jammy's system GTK4 at
# all (`pkg-config` fails: "Requested 'gtk4 >= 4.10' but version of GTK is
# 4.6.9"), regardless of which `v4_*`/`v1_*`/`v2_*` feature is selected, and
# there is no verified official PPA backporting GTK4 4.10+ to jammy. jammy
# (and any other older/unsupported release) is instead served via the
# Flatpak package built by this same workflow, which bundles its own GNOME
# runtime and is unaffected by the host's system library versions.
ubuntu-noble = ["gtk/v4_14", "gdk-wayland/v4_12", "adw/v1_5", "webkit/v2_52"]
ubuntu-resolute = ["gtk/v4_22", "gdk-wayland/v4_20", "adw/v1_9", "webkit/v2_52"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.4" }
gdk-wayland = { package = "gdk4-wayland", version = "0.11.4", features = ["wayland_crate"] }
adw = { package = "libadwaita", version = "0.9.2" }
webkit = { package = "webkit6", version = "0.6.1" }
ashpd = { version = "0.13.12", features = ["background", "gtk4", "inhibit", "open_uri"] }
ksni = "0.3.5"
mpris-server = "0.10.0"
clap = { version = "4.6.1", features = ["derive"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
tokio = { version = "1.52.3", features = ["full"] }
libloading = "0.9.0"
epoxy = "0.1.0"
flume = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = "1.0.228"
serde_json = "1.0.150"
itertools = "0.15.0"
libmpv2 = "5.0.3"
image = "0.25.10"
chrono = "0.4.45"
anyhow = "1.0.103"
url = "2.5.8"
dirs = "6.0.0"
base64 = "0.22.1"

[build-dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"

[package.metadata.deb]
name = "stremio"
extended-description = """\
Stremio is a modern media center that gives you the best experience for \
discovering and watching video content: movies, TV series, YouTube, live \
TV and more."""
# `$auto` lets cargo-deb inspect the built binary's linked shared libraries
# (via dpkg-shlibdeps) and generate runtime package names/minimum versions for
# most transitive dependencies (libc, openssl, mpv, GTK/Adwaita/WebKit, etc).
# The package is now built once per supported Ubuntu release (jammy/noble/
# resolute, see the `ubuntu-*` Cargo features above and
# .github/workflows/release.yml), each in a container matching that release
# with the matching `-dev` packages installed. In that setup `dpkg-shlibdeps`
# reliably resolves the real runtime package names/minimum versions for the
# GTK/Adwaita/WebKit libraries actually linked in each build, so no manual
# per-version pin is required (a single static pin here would be wrong for at
# least two of the three targets, since jammy/noble/resolute ship different
# GTK/Adwaita/WebKit versions). If a build environment lacks the proper -dev
# shlibs metadata, dpkg-shlibdeps can still fall back to guessing a bogus name
# from the shared library's SONAME (e.g. `libgtk-4` instead of `libgtk-4-1`);
# make sure the corresponding `-dev` package is installed for the target
# release before invoking `cargo deb` if that happens.
depends = "$auto, nodejs"
assets = [
    ["target/release/stremio-linux-shell", "/usr/libexec/stremio/stremio", "755"],
    ["data/server.js", "/usr/libexec/stremio/server.js", "644"],
    ["data/stremio.sh", "/usr/bin/stremio", "755"],
    ["data/com.stremio.Stremio.desktop", "/usr/share/applications/com.stremio.Stremio.desktop", "644"],
    ["data/com.stremio.Stremio.service", "/usr/share/dbus-1/services/com.stremio.Stremio.service", "644"],
    ["data/com.stremio.Stremio.metainfo.xml", "/usr/share/metainfo/com.stremio.Stremio.metainfo.xml", "644"],
    ["data/com.stremio.Stremio.gschema.xml", "/usr/share/glib-2.0/schemas/com.stremio.Stremio.gschema.xml", "644"],
    ["data/icons/com.stremio.Stremio.svg", "/usr/share/icons/hicolor/scalable/apps/com.stremio.Stremio.svg", "644"],
    ["po/es/LC_MESSAGES/stremio.mo", "/usr/share/locale/es/LC_MESSAGES/stremio.mo", "644"],
    ["po/fr/LC_MESSAGES/stremio.mo", "/usr/share/locale/fr/LC_MESSAGES/stremio.mo", "644"],
    ["LICENSE", "/usr/share/licenses/stremio/LICENSE", "644"],
]