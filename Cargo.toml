[package]
name = "stremio-linux-shell"
version = "1.1.2"
description = "Freedom to Stream"
authors = ["Stremio"]
homepage = "https://stremio.com"
repository = "https://github.com/Stremio/stremio-linux-shell"
license = "GPL-3.0-only"
edition = "2024"

[features]
# `default` is the newest API set we support, so a plain `cargo build` works for
# developers on current Ubuntu and for the Flatpak (which builds with default
# features against the GNOME 50 SDK). Packaging never relies on it: every .deb
# build passes --no-default-features --features <set> explicitly.
default = ["api-4_22"]
offline-build = []

# API-level sets, each pinning the GTK/libadwaita/WebKitGTK versions a build
# targets. They are named after the API levels rather than after distributions
# on purpose: the crate has no opinion about Ubuntu, and the Flatpak builds with
# `default` and must not appear to depend on an Ubuntu release. The mapping from
# a distribution release to one of these sets lives in packaging/releases.json,
# which is also what drives the CI matrix. Several releases can share a set —
# Ubuntu 26.10 (GTK 4.23) reuses api-4_22.
#
# Building with a higher set than a target ships compiles fine on a newer host
# and then fails at runtime on that target, so a set must never exceed what the
# release mapped to it provides. build.yml type-checks every set on each push.
#
# Verified against each release's archive on 2026-07-16:
#   Ubuntu 24.04 LTS (noble)    GTK 4.14.5  libadwaita 1.5.0  WebKitGTK 2.52.3
#   Ubuntu 26.04 LTS (resolute) GTK 4.22.4  libadwaita 1.9.0  WebKitGTK 2.52.3
#
# There is deliberately no set below api-4_14. The crate cannot be built against
# GTK older than 4.10 at any API level: `webkit6` references `gtk::Accessible`
# in its generated bindings with no version cfg guard, and that type requires
# GTK feature v4_10+. This is what rules out Ubuntu 22.04 (GTK 4.6.9) — the
# failure is inside the dependency, so no selection here avoids it. See
# packaging/README.md.
api-4_14 = ["gtk/v4_14", "gdk-wayland/v4_12", "adw/v1_5", "webkit/v2_52"]
api-4_22 = ["gtk/v4_22", "gdk-wayland/v4_20", "adw/v1_9", "webkit/v2_52"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.4" }
gdk-wayland = { package = "gdk4-wayland", version = "0.11.4", features = ["wayland_crate"] }
adw = { package = "libadwaita", version = "0.9.2" }
webkit = { package = "webkit6", version = "0.6.1" }
ashpd = { version = "0.13.12", features = ["background", "gtk4", "inhibit", "open_uri"] }
ksni = "0.3.5"
mpris-server = "0.10.0"
clap = { version = "4.6.1", features = ["derive"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
tokio = { version = "1.52.3", features = ["full"] }
libloading = "0.9.0"
epoxy = "0.1.0"
flume = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = "1.0.228"
serde_json = "1.0.150"
itertools = "0.15.0"
libmpv2 = "5.0.3"
image = "0.25.10"
chrono = "0.4.45"
anyhow = "1.0.103"
url = "2.5.8"
dirs = "6.0.0"
base64 = "0.22.1"

[build-dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"

[package.metadata.deb]
name = "stremio"
extended-description = """\
Stremio is a modern media center that gives you the best experience for \
discovering and watching video content: movies, TV series, YouTube, live \
TV and more."""
# `$auto` lets cargo-deb inspect the built binary's linked shared libraries
# (via dpkg-shlibdeps) and generate runtime package names/minimum versions for
# most transitive dependencies (libc, openssl, mpv, etc). However, in some
# build environments (e.g. non-standard PKG_CONFIG_PATH, Flatpak/GNOME SDK
# extensions on the PATH, or containers missing the exact -dev shlibs
# metadata) dpkg-shlibdeps silently falls back to guessing a dependency name
# from the shared library's SONAME instead of resolving the real package,
# producing bogus/uninstallable names like `libgtk-4`, `libadwaita-1` and
# `libwebkitgtk-6.0` (the real runtime packages are `libgtk-4-1`,
# `libadwaita-1-0` and `libwebkitgtk-6.0-4`). To make the produced `.deb`
# reliably installable regardless of the build environment, the GTK/Adwaita/
# WebKit runtime deps are pinned explicitly here, with minimum versions
# matching the `v4_22`/`v1_9`/`v2_52` feature flags requested above; `$auto`
# is kept for the remaining transitive dependencies.
depends = "libgtk-4-1 (>= 4.22), libadwaita-1-0 (>= 1.9), libwebkitgtk-6.0-4 (>= 2.52), $auto, nodejs"
assets = [
    ["target/release/stremio-linux-shell", "/usr/libexec/stremio/stremio", "755"],
    ["data/server.js", "/usr/libexec/stremio/server.js", "644"],
    ["data/stremio.sh", "/usr/bin/stremio", "755"],
    ["data/com.stremio.Stremio.desktop", "/usr/share/applications/com.stremio.Stremio.desktop", "644"],
    ["data/com.stremio.Stremio.service", "/usr/share/dbus-1/services/com.stremio.Stremio.service", "644"],
    ["data/com.stremio.Stremio.metainfo.xml", "/usr/share/metainfo/com.stremio.Stremio.metainfo.xml", "644"],
    ["data/com.stremio.Stremio.gschema.xml", "/usr/share/glib-2.0/schemas/com.stremio.Stremio.gschema.xml", "644"],
    ["data/icons/com.stremio.Stremio.svg", "/usr/share/icons/hicolor/scalable/apps/com.stremio.Stremio.svg", "644"],
    ["po/es/LC_MESSAGES/stremio.mo", "/usr/share/locale/es/LC_MESSAGES/stremio.mo", "644"],
    ["po/fr/LC_MESSAGES/stremio.mo", "/usr/share/locale/fr/LC_MESSAGES/stremio.mo", "644"],
    ["LICENSE", "/usr/share/licenses/stremio/LICENSE", "644"],
]